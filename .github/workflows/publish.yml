name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      # deno publish reads an OIDC token to attach provenance to the release, so
      # the transparency log entry proves this workflow built what JSR serves.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Same pinned version as the check workflow.
          deno-version: v2.9.6

      # Version bumps land as ordinary commits on main, so the branch is pushed
      # far more often than a release happens. Ask the registry what it already
      # has and stop here for every commit that does not raise the version.
      - id: state
        run: |
          package="$(deno eval --quiet 'const c = JSON.parse(await Deno.readTextFile("deno.json")); console.log(`${c.name}\t${c.version}`)')"
          name="${package%%$'\t'*}"
          version="${package##*$'\t'}"
          meta="$(curl -fsSL "https://jsr.io/${name}/meta.json")"
          if printf '%s' "$meta" | deno eval --quiet "
            const meta = JSON.parse(await new Response(Deno.stdin.readable).text());
            Deno.exit(Object.hasOwn(meta.versions ?? {}, '$version') ? 0 : 1);
          "; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "publishing $name@$version"
          fi

      # The check workflow runs on this same commit, but nothing makes one job
      # wait for the other, so a release re-runs the gate rather than assume it.
      - if: steps.state.outputs.new == 'true'
        run: deno task ci

      - if: steps.state.outputs.new == 'true'
        run: deno publish
